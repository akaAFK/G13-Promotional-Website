services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: g13
      POSTGRES_PASSWORD: g13
      POSTGRES_DB: g13
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g13 -d g13"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://g13:g13@postgres:5432/g13
      POSTGRES_USER: g13
      POSTGRES_PASSWORD: g13
      POSTGRES_DB: g13
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:

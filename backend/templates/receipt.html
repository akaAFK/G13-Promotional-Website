<!doctype html>
<html lang="en">
<body style="margin:0;background:#0f0f11;color:#e8e0d0;font-family:Arial,sans-serif">
  <div style="max-width:560px;margin:0 auto;padding:40px 28px">
    <div style="font-size:34px;font-weight:900;letter-spacing:-2px">G<span style="color:#d4af37">13</span></div>
    <p style="font-size:11px;letter-spacing:3px;color:#d4af37">PRE-ORDER CONFIRMED</p>
    <h1 style="font-family:Georgia,serif;font-size:30px;margin:30px 0 12px">THE DESCENT IS BOOKED.</h1>
    <table style="width:100%;border-collapse:collapse;margin-top:24px;font-size:13px">
      <tr><td style="padding:10px 0;color:#9a9288;border-bottom:1px solid rgba(212,175,55,.2)">Order</td><td style="padding:10px 0;border-bottom:1px solid rgba(212,175,55,.2)">{{ id[:8]|upper }}</td></tr>
      <tr><td style="padding:10px 0;color:#9a9288;border-bottom:1px solid rgba(212,175,55,.2)">Edition</td><td style="padding:10px 0;border-bottom:1px solid rgba(212,175,55,.2)">{{ edition }}</td></tr>
      <tr><td style="padding:10px 0;color:#9a9288;border-bottom:1px solid rgba(212,175,55,.2)">Amount</td><td style="padding:10px 0;border-bottom:1px solid rgba(212,175,55,.2)">{{ "%.2f"|format(amount_cents / 100) }} USD</td></tr>
      <tr><td style="padding:10px 0;color:#9a9288">Status</td><td style="padding:10px 0;color:#d4af37">{{ status|upper }}</td></tr>
    </table>
    <p style="font-size:11px;color:#756b62;margin-top:36px">Demo transaction — no real charge was made.</p>
  </div>
</body>
</html>
